<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make a wish | Afnan Fathima</title>
<meta name="theme-color" content="#FFD6EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400;500;600;700&family=Great+Vibes&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body class="pg-cake">
  <div class="floaters" id="float" aria-hidden="true"></div>
  <div id="stage" aria-label="A 3D birthday cake. Blow out the candles, then drag across the cake to cut it." role="img"></div>
  <canvas id="trail" aria-hidden="true"></canvas>

  <a class="pill pill-back" href="home.html#cake"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg>Return home</a>
  <button class="pill pill-music" id="music" type="button" aria-pressed="false">
    <svg class="ic" aria-hidden="true"><use href="#i-music"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl">Play music</span>
  </button>

  <header class="cake-top" id="top">
    <p class="label">Chapter 5</p>
    <h1>Make a wish,<br>Afnan Fathima</h1>
  </header>

  <div class="celebrate" id="celebrate" aria-live="polite">
    <p class="script">Happy Birthday</p>
    <h2 id="celName">AFNAN FATHIMA</h2>
  </div>

  <div class="cake-ui">
    <p class="cake-status" id="status" aria-live="polite"></p>
    <div class="meter" id="meter" hidden><i></i></div>
    <div class="cake-actions" id="actions"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
'use strict';
const $ = App.$;
App.floaters($('#float'), { count: 12, seed: 31, opacity: .5 });
App.letters($('#celName'), { text: 'AFNAN|FATHIMA' });
const music = App.music($('#music'), 'media/happy_birthday.mp3', { volume: .75 });
const statusEl = $('#status'), actionsEl = $('#actions'), meter = $('#meter'), meterBar = $('#meter i');
const small = Math.min(innerWidth, innerHeight) < 600;
let state = 'lit';

function button(label, icon, cls, fn){
  const b = document.createElement(fn === null ? 'span' : (typeof fn === 'string' ? 'a' : 'button'));
  b.className = 'btn ' + cls; b.innerHTML = (icon ? App.icon(icon) : '') + '<span>' + label + '</span>';
  if (typeof fn === 'string') b.href = fn; else if (fn){ b.type = 'button'; b.addEventListener('click', fn); }
  return b;
}
function ui(s){
  state = s; actionsEl.replaceChildren(); meter.hidden = s !== 'listening';
  if (s === 'lit'){
    statusEl.textContent = 'Make a wish, then blow out the candles.';
    actionsEl.append(button('Blow the candles', 'wind', 'btn-pink', blow));
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) actionsEl.append(button('Use my mic', 'mic', 'btn-white', startMic));
  } else if (s === 'listening'){
    statusEl.textContent = 'Listening. Blow into your mic.';
    actionsEl.append(button('Tap instead', 'wind', 'btn-white', () => { endMic(); blow(); }));
  } else if (s === 'blown'){
    statusEl.innerHTML = App.icon('slice') + '<span>Wish made. Now drag across the cake to cut it.</span>';
    actionsEl.append(button('Cut it for me', null, 'btn-white', () => autoCut()));
  } else if (s === 'cutting'){
    statusEl.textContent = '';
  } else if (s === 'done'){
    statusEl.textContent = '';
    actionsEl.append(button('One more surprise', 'crown', 'btn-pink', 'masterpiece.html'));
    actionsEl.append(button('Cut another cake', 'again', 'btn-white', reset));
  }
}

/* ---------------- mic: blow to put the candles out ---------------- */
let stopMic = null, micTimer = 0;
function endMic(){ if (stopMic){ stopMic(); stopMic = null; } clearTimeout(micTimer); meterBar.style.width = '0'; }
async function startMic(){
  try {
    const ac = App.sfx.ensure(); if (!ac) throw new Error('no audio');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    ui('listening');
    const src = ac.createMediaStreamSource(stream), an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Uint8Array(an.fftSize); let hot = 0, raf = 0;
    stopMic = () => { cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop()); src.disconnect(); };
    const loop = () => {
      an.getByteTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++){ const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      meterBar.style.width = Math.min(100, rms * 400) + '%';
      hot = rms > .16 ? hot + 1 : Math.max(0, hot - 1);
      if (hot > 8){ endMic(); blow(); return; }
      raf = requestAnimationFrame(loop);
    };
    loop();
    micTimer = setTimeout(() => { if (state === 'listening'){ endMic(); App.toast('Didn’t catch that. Tap to blow instead.'); ui('lit'); } }, 15000);
  } catch (e) { App.toast('Mic isn’t available here. Tap to blow instead.'); if (state === 'listening') ui('lit'); }
}

/* ---------------- celebration (shared by 3D and fallback) ---------------- */
function celebrate(){
  ui('done');
  $('#top').classList.add('hide');
  $('#celebrate').classList.add('show'); $('#celName').classList.add('pop');
  App.confetti.cannon(); setTimeout(() => App.confetti.rain(), 500);
  if (!music.playing) music.play();
}

/* ---------------- fallback when 3D is not available ---------------- */
function webglOK(){ try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch (e) { return false; } }
if (!window.THREE || !webglOK()){
  const box = document.createElement('div'); box.className = 'no3d';
  box.innerHTML = '<p style="font-weight:700;max-width:22em">This browser can’t show the 3D cake, but the celebration still works.</p>';
  document.body.appendChild(box);
  window.blow = () => {};
  ui('lit');
  actionsEl.replaceChildren(button('Celebrate', 'sparkles', 'btn-pink', () => { box.remove(); celebrate(); }));
  return;
}

/* =====================================================================
   3D CAKE (three.js). Light on purpose: 3 lights, no shadow maps,
   sprinkles, pearls and drips drawn as single instanced batches.
   ===================================================================== */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: (window.devicePixelRatio || 1) < 2, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 2 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 120);
const target = new THREE.Vector3(0, 3.1, 0);
let zoom = 1, zoomTo = 1, lift = 0, liftTo = 0;
function frameCamera(){
  const a = innerWidth / innerHeight, tv = Math.tan(camera.fov * Math.PI / 360);
  const portrait = a < .9, fitH = portrait ? 16.5 : 19.5, fitW = portrait ? 13.6 : 13.5;
  const dist = Math.max(fitH / 2 / tv, fitW / 2 / (tv * a)) * zoom;
  const ty = target.y + lift;
  camera.position.set(0, ty + dist * .42, dist * .91);
  camera.lookAt(0, ty, 0);
}
function onResize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); frameCamera(); sizeTrail(); }
addEventListener('resize', onResize, { passive: true });
frameCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0xffd1e6, .78));
const key = new THREE.DirectionalLight(0xffffff, .72); key.position.set(6, 12, 9); scene.add(key);
const warm = new THREE.PointLight(0xffb04a, 0, 12, 2); warm.position.set(0, 7.2, 1.5); scene.add(warm);

/* textures drawn once */
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); return t; }
const flameTex = canvasTex(64, 128, (g, w, h) => {
  const gr = g.createRadialGradient(32, 92, 2, 32, 80, 60); gr.addColorStop(0, 'rgba(255,255,235,1)'); gr.addColorStop(.25, 'rgba(255,214,90,1)'); gr.addColorStop(.6, 'rgba(255,120,40,.85)'); gr.addColorStop(1, 'rgba(255,60,20,0)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(32, 4); g.bezierCurveTo(52, 50, 58, 80, 32, 124); g.bezierCurveTo(6, 80, 12, 50, 32, 4); g.fill();
});
const glowTex = canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,190,90,.9)'); gr.addColorStop(1, 'rgba(255,170,60,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
const smokeTex = canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(210,205,215,.8)'); gr.addColorStop(1, 'rgba(210,205,215,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
const shadowTex = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 10, 64, 64, 64); gr.addColorStop(0, 'rgba(90,30,70,.35)'); gr.addColorStop(1, 'rgba(90,30,70,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); });
function stripeTex(c1){ const t = canvasTex(64, 64, (g) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 64); g.fillStyle = c1; for (let i = -64; i < 128; i += 22){ g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 11, 0); g.lineTo(i + 11 - 64, 64); g.lineTo(i - 64, 64); g.fill(); } }); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 2); return t; }
function spongeTex(frost, jam){
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#FFE2A8'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++){ g.fillStyle = 'rgba(214,160,80,' + (Math.random() * .25) + ')'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    const band = (y, hh, col) => { g.fillStyle = col; g.fillRect(0, y, w, hh); };
    band(h * .30, h * .05, '#FFF8EE'); band(h * .35, h * .035, jam);
    band(h * .62, h * .05, '#FFF8EE'); band(h * .67, h * .035, jam);
    g.fillStyle = frost; g.fillRect(0, 0, w, h * .07); g.fillRect(0, 0, w * .035, h); g.fillRect(w * .965, 0, w * .035, h); g.fillRect(0, h * .965, w, h * .035);
  });
}

/* plate and soft shadow (never cut) */
const plate = new THREE.Mesh(new THREE.CylinderGeometry(5.3, 5.05, .26, 72), new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 60, specular: 0x666666 }));
plate.position.y = -.13; scene.add(plate);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(13, 13), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = -.3; scene.add(shadow);

/* cake body */
const root = new THREE.Group(); scene.add(root);
const body = new THREE.Group(); root.add(body);
const TIERS = [
  { rb: 3.6, rt: 3.5, h: 1.7, color: 0xFF7EB3, frost: '#FF7EB3', jam: '#E8256F' },
  { rb: 2.75, rt: 2.66, h: 1.4, color: 0x63D5C4, frost: '#63D5C4', jam: '#E8256F' },
  { rb: 1.95, rt: 1.87, h: 1.15, color: 0xFFCB52, frost: '#FFCB52', jam: '#FF7A33' },
  { rb: 1.3, rt: 1.23, h: .95, color: 0xB49AFF, frost: '#B49AFF', jam: '#7C4DFF' }
];
let base = 0;
const seg = small ? 48 : 72;
const cream = new THREE.MeshPhongMaterial({ color: 0xFFF7FB, shininess: 30, specular: 0x444444 });
TIERS.forEach(t => {
  t.base = base; t.top = base + t.h; t.cy = base + t.h / 2; base += t.h;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(t.rt, t.rb, t.h, seg), new THREE.MeshPhongMaterial({ color: t.color, shininess: 16, specular: 0x2a2a2a }));
  m.position.y = t.cy; body.add(m);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(t.rt - .04, .13, 10, seg), cream); rim.rotation.x = Math.PI / 2; rim.position.y = t.top; body.add(rim);
  const sh = new THREE.Shape(); sh.moveTo(-t.rb, -t.h / 2); sh.lineTo(t.rb, -t.h / 2); sh.lineTo(t.rt, t.h / 2); sh.lineTo(-t.rt, t.h / 2); sh.lineTo(-t.rb, -t.h / 2);
  t.faceGeo = new THREE.ShapeGeometry(sh);
  const uv = t.faceGeo.attributes.uv, pos = t.faceGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + t.rb) / (2 * t.rb), (pos.getY(i) + t.h / 2) / t.h);
  t.faceMat = new THREE.MeshPhongMaterial({ map: spongeTex(t.frost, t.jam), shininess: 4, emissive: 0x3b2c22, side: THREE.DoubleSide });
});
const TOP = base;
const bottomRim = new THREE.Mesh(new THREE.TorusGeometry(3.6, .14, 10, seg), cream); bottomRim.rotation.x = Math.PI / 2; bottomRim.position.y = .08; body.add(bottomRim);

const dummy = new THREE.Object3D();
/* drips */
(function(){
  const list = [];
  TIERS.forEach((t, k) => { const n = [16, 14, 11, 9][k]; for (let i = 0; i < n; i++){ const a = (i / n) * Math.PI * 2 + k * .4 + Math.random() * .2, len = .25 + Math.random() * .42; list.push({ a, len, r: t.rt + .02, y: t.top - len * .5 + .04 }); } });
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 10), cream, list.length);
  list.forEach((d, i) => { dummy.position.set(Math.cos(d.a) * d.r, d.y, Math.sin(d.a) * d.r); dummy.rotation.set(0, 0, 0); dummy.scale.set(.13, d.len * .55, .13); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); });
  body.add(im);
})();
/* pearls */
(function(){
  const list = [];
  TIERS.forEach((t, k) => { if (k === 0) return; const n = Math.round(t.rb * 14); for (let i = 0; i < n; i++){ const a = (i / n) * Math.PI * 2; list.push([Math.cos(a) * (t.rb + .05), t.base + .1, Math.sin(a) * (t.rb + .05)]); } });
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(.1, 10, 8), new THREE.MeshPhongMaterial({ color: 0xFFD66B, shininess: 90, specular: 0xffffff }), list.length);
  list.forEach((p, i) => { dummy.position.set(p[0], p[1], p[2]); dummy.scale.set(1, 1, 1); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); });
  body.add(im);
})();
/* sprinkles: one draw call, many colors */
(function(){
  const N = small ? 170 : 280, colors = [0xFF3E8A, 0xFF7A33, 0xFFC43D, 0x12B8A6, 0x3D8BFF, 0x7C4DFF, 0xffffff];
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(.034, .034, .22, 6), new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 40 }), N);
  const col = new THREE.Color(), out = new THREE.Vector3();
  for (let i = 0; i < N; i++){
    const k = i % 4, t = TIERS[k], a = Math.random() * Math.PI * 2;
    if (Math.random() < .62){
      const y = t.base + .25 + Math.random() * (t.h - .55), r = t.rb + (t.rt - t.rb) * ((y - t.base) / t.h) + .025;
      dummy.position.set(Math.cos(a) * r, y, Math.sin(a) * r); out.set(Math.cos(a) * 9, y, Math.sin(a) * 9); dummy.lookAt(out); dummy.rotateZ(Math.random() * Math.PI);
    } else {
      const inner = k < 3 ? TIERS[k + 1].rb + .2 : .2, r = inner + Math.random() * (t.rt - .25 - inner);
      dummy.position.set(Math.cos(a) * r, t.top + .03, Math.sin(a) * r); dummy.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI);
    }
    dummy.scale.set(1, 1, 1); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); im.setColorAt(i, col.setHex(colors[i % colors.length]));
  }
  body.add(im);
})();

/* candles with flames, glow and smoke */
const candles = [], flames = [], smokes = [];
const candleMats = ['#FF3E8A', '#12B8A6', '#7C4DFF'].map(c => new THREE.MeshPhongMaterial({ map: stripeTex(c), shininess: 30 }));
const wickMat = new THREE.MeshBasicMaterial({ color: 0x3a2a2a });
const candleGeo = new THREE.CylinderGeometry(.085, .085, 1, 16), wickGeo = new THREE.CylinderGeometry(.018, .018, .16, 6);
for (let i = 0; i < 9; i++){
  const g = new THREE.Group(), a = (i / 9) * Math.PI * 2 + .3, r = i === 8 ? 0 : .78;
  const ang = i === 8 ? 0 : (i / 8) * Math.PI * 2 + .3;
  g.position.set(Math.cos(ang) * r, TOP, Math.sin(ang) * r);
  const c = new THREE.Mesh(candleGeo, candleMats[i % 3]); c.position.y = .5; g.add(c);
  const w = new THREE.Mesh(wickGeo, wickMat); w.position.y = 1.07; g.add(w);
  const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  f.position.y = 1.36; f.scale.set(.28, .56, 1); g.add(f);
  const gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: .55 }));
  gl.position.y = 1.32; gl.scale.set(1.1, 1.1, 1); g.add(gl);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0 }));
  s.position.y = 1.3; s.scale.set(.3, .3, 1); scene.add(s);
  root.add(g); candles.push(g); flames.push({ f, gl, i }); smokes.push({ s, g, t: -1 });
}

/* knife that follows your finger while cutting */
const knife = new THREE.Group();
const blade = new THREE.Mesh(new THREE.BoxGeometry(.07, 2.5, .62), new THREE.MeshPhongMaterial({ color: 0xE8EDF5, shininess: 120, specular: 0xffffff }));
blade.position.y = -1.25; knife.add(blade);
const handle = new THREE.Mesh(new THREE.CylinderGeometry(.15, .17, 1.3, 16), new THREE.MeshPhongMaterial({ color: 0xFF3E8A, shininess: 40 }));
handle.position.y = .65; knife.add(handle);
knife.visible = false; scene.add(knife);
const knifeTarget = new THREE.Vector3(0, 6.6, 0);

/* swipe trail (2D) */
const trail = $('#trail'), tctx = trail.getContext('2d'); let tdpr = 1, pts = [];
function sizeTrail(){ tdpr = Math.min(window.devicePixelRatio || 1, 2); trail.width = innerWidth * tdpr; trail.height = innerHeight * tdpr; }
sizeTrail();
function drawTrail(now){
  tctx.setTransform(tdpr, 0, 0, tdpr, 0, 0); tctx.clearRect(0, 0, innerWidth, innerHeight);
  pts = pts.filter(p => now - p.t < 260); if (pts.length < 2) return;
  tctx.lineCap = 'round'; tctx.lineJoin = 'round';
  for (let i = 1; i < pts.length; i++){
    const k = 1 - (now - pts[i].t) / 260;
    tctx.strokeStyle = 'rgba(255,255,255,' + (k * .95).toFixed(3) + ')'; tctx.lineWidth = 2 + k * 9;
    tctx.beginPath(); tctx.moveTo(pts[i - 1].x, pts[i - 1].y); tctx.lineTo(pts[i].x, pts[i].y); tctx.stroke();
  }
}

/* ---------------- blow ---------------- */
let flameK = 1, flameTo = 1;
function blow(){
  if (state !== 'lit' && state !== 'listening') return;
  App.sfx.whoosh(); flameTo = 0;
  const now = performance.now(); smokes.forEach((s, i) => { s.t = now + i * 40; });
  ui('blown');
}

/* ---------------- cut ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const planeMid = new THREE.Plane(new THREE.Vector3(0, 1, 0), -2.6), planeKnife = new THREE.Plane(new THREE.Vector3(0, 1, 0), -6.6);
function worldAt(e, plane){
  const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera); const p = new THREE.Vector3(); return ray.ray.intersectPlane(plane, p) ? p : null;
}
let dragging = false, first = null, halves = null, sep = 0, plunge = 0;
canvas.addEventListener('pointerdown', e => {
  if (state === 'lit'){ App.toast('Blow out the candles first'); return; }
  if (state !== 'blown') return;
  dragging = true; first = null; canvas.setPointerCapture(e.pointerId); knife.visible = true;
  App.sfx.ensure(); music.audio.load();
  track(e);
});
canvas.addEventListener('pointermove', e => { if (dragging) track(e); });
const endDrag = () => { if (!dragging) return; dragging = false; if (state === 'blown'){ knife.visible = false; if (first) App.toast('Swipe all the way across the cake'); } };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
function track(e){
  pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  const k = worldAt(e, planeKnife); if (k) knifeTarget.set(k.x, 6.6, k.z);
  const p = worldAt(e, planeMid); if (!p) return;
  if (Math.hypot(p.x, p.z) < 3.8){
    if (!first) first = p.clone();
    else if (Math.hypot(p.x - first.x, p.z - first.z) >= 3.2) cut(first, p);
  }
}
function autoCut(){ knife.visible = true; knifeTarget.set(0, 6.6, 0); knife.position.copy(knifeTarget); cut(new THREE.Vector3(0, 0, -3), new THREE.Vector3(0, 0, 3)); }
function cut(p1, p2){
  if (state !== 'blown') return;
  dragging = false; ui('cutting');
  const d = new THREE.Vector3(p2.x - p1.x, 0, p2.z - p1.z).normalize();
  const n = new THREE.Vector3(-d.z, 0, d.x); if (n.x < 0) n.negate();
  root.rotation.y = 0; root.updateMatrixWorld(true);
  const planeA = new THREE.Plane(n.clone(), 0), planeB = new THREE.Plane(n.clone().negate(), 0);
  const make = (plane, sign) => {
    const half = body.clone(true);
    half.traverse(o => { if (o.isMesh){ o.material = o.material.clone(); o.material.clippingPlanes = [plane]; } });
    candles.forEach(cg => { if (n.dot(cg.position) * sign >= 0){ const c = cg.clone(true); c.children.forEach(ch => { if (ch.isSprite) ch.visible = false; }); half.add(c); } });
    TIERS.forEach(t => { const m = new THREE.Mesh(t.faceGeo, t.faceMat); m.position.set(0, t.cy, 0); m.lookAt(-n.x * sign * 10, t.cy, -n.z * sign * 10); half.add(m); });
    pivot.add(half); return half;
  };
  const pivot = new THREE.Group(); scene.add(pivot);
  halves = { pivot, a: make(planeA, 1), b: make(planeB, -1), n, planeA, planeB, localA: planeA.clone(), localB: planeB.clone(), theta: Math.atan2(n.z, n.x) };
  root.visible = false; sep = 0; plunge = 1;
  App.sfx.slice();
  setTimeout(() => { knife.visible = false; }, 650);
  setTimeout(() => { zoomTo = 1.12; liftTo = small ? .4 : 1.1; celebrate(); }, 700);
}
function reset(){
  if (halves){ scene.remove(halves.pivot); halves.a.traverse(o => { if (o.isMesh && o.material.clippingPlanes) o.material.dispose(); }); halves.b.traverse(o => { if (o.isMesh && o.material.clippingPlanes) o.material.dispose(); }); halves = null; }
  root.visible = true; flameTo = 1; zoomTo = 1; liftTo = 0;
  $('#top').classList.remove('hide'); $('#celebrate').classList.remove('show');
  ui('lit');
}

/* ---------------- render loop (pauses when the tab is hidden) ---------------- */
const t0 = performance.now(); let last = t0;
function tick(now){
  requestAnimationFrame(tick);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = (now - t0) / 1000;
  flameK += (flameTo - flameK) * Math.min(1, dt * (flameTo ? 3 : 9));
  flames.forEach(({ f, gl, i }) => {
    const s = flameK; f.scale.set(.28 * (1 + .1 * Math.sin(t * 13 + i)) * s, .56 * (1 + .14 * Math.sin(t * 17 + i * 1.7)) * s, 1);
    f.material.opacity = Math.min(1, s * 1.2); gl.material.opacity = .55 * s * (.85 + .15 * Math.sin(t * 9 + i));
  });
  warm.intensity = flameK * (1.1 + .22 * Math.sin(t * 21));
  smokes.forEach(sm => {
    if (sm.t < 0 || now < sm.t) return;
    const k = (now - sm.t) / 1800; const wp = new THREE.Vector3(); sm.g.getWorldPosition(wp);
    if (k >= 1){ sm.s.material.opacity = 0; sm.t = -1; return; }
    sm.s.position.set(wp.x + Math.sin(k * 6 + wp.x) * .15, wp.y + 1.3 + k * 2.2, wp.z); sm.s.scale.setScalar(.3 + k * 1.1); sm.s.material.opacity = .7 * (1 - k) * Math.min(1, k * 6);
  });
  if (state === 'lit' || state === 'listening') root.rotation.y = Math.sin(t * .35) * .07; else root.rotation.y *= .9;
  if (knife.visible){
    if (plunge > 0){ plunge = Math.max(0, plunge - dt * 1.6); knife.position.y = 6.6 - Math.sin((1 - plunge) * Math.PI) * 2.6; }
    else { knife.position.lerp(knifeTarget, Math.min(1, dt * 18)); }
    knife.position.x += (knifeTarget.x - knife.position.x) * Math.min(1, dt * 18); knife.position.z += (knifeTarget.z - knife.position.z) * Math.min(1, dt * 18);
    knife.rotation.z = Math.sin(t * 6) * .05;
  }
  if (halves && sep < 1){
    /* halves slide apart, the cake turns so the cut faces the camera, then each half opens like a book */
    sep = Math.min(1, sep + dt / 1.7); const k = 1 - Math.pow(1 - sep, 3), dist = 2.2 * k, open = .62 * k;
    halves.pivot.rotation.y = halves.theta * k;
    halves.a.position.copy(halves.n).multiplyScalar(dist); halves.b.position.copy(halves.n).multiplyScalar(-dist);
    halves.a.rotation.y = open; halves.b.rotation.y = -open;
    halves.pivot.updateMatrixWorld(true);
    halves.planeA.copy(halves.localA).applyMatrix4(halves.a.matrixWorld);
    halves.planeB.copy(halves.localB).applyMatrix4(halves.b.matrixWorld);
  }
  if (Math.abs(zoomTo - zoom) > .001 || Math.abs(liftTo - lift) > .001){ zoom += (zoomTo - zoom) * Math.min(1, dt * 2.2); lift += (liftTo - lift) * Math.min(1, dt * 2.2); frameCamera(); }
  renderer.render(scene, camera);
  drawTrail(now);
}
ui('lit');
requestAnimationFrame(tick);
window.__cake = { cut: autoCut, blow: () => blow(), get state(){ return state; } };
})();
</script>
